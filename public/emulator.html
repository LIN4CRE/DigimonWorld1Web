<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digimon World (Europe) — Instant Play</title>
  <meta name="description" content="Playable Digimon World 1 (PS1) in HD with instant-resume, automatic saves, and unlocked partners." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.emulatorjs.org" />
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #game {
      width: 100vw;
      height: 100vh;
    }
    #loader-overlay {
      position: fixed;
      inset: 0;
      background: #04070f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
    }
    #loader-title {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fbbf24, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #progress-wrap {
      width: min(380px, 80vw);
      height: 8px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #06b6d4);
      transition: width 0.15s ease;
    }
    #loader-status {
      font-size: 13px;
      color: #94a3b8;
      font-family: monospace;
    }
    #save-bar {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.45;
      transition: opacity 0.2s ease, background 0.2s ease;
      font: 12px system-ui, sans-serif;
      background: rgba(13, 20, 38, 0.85);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(36, 53, 94, 0.7);
      backdrop-filter: blur(8px);
    }
    #save-bar:hover {
      opacity: 1;
      background: rgba(13, 20, 38, 0.98);
      border-color: rgba(245, 158, 11, 0.5);
    }
    .save-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #94a3b8;
      font-size: 11px;
      font-family: monospace;
      padding-right: 4px;
    }
    .indicator-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    #save-bar button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 5px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    #save-bar button:hover {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }
    #save-toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d1426;
      color: #f8fafc;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 8px 16px;
      font: 13px system-ui, sans-serif;
      z-index: 60;
      display: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 12px rgba(245, 158, 11, 0.25);
    }
  </style>
</head>
<body>
  <div id="loader-overlay">
    <div id="loader-title">Digimon World (Europe)</div>
    <div id="progress-wrap">
      <div id="progress-bar"></div>
    </div>
    <div id="loader-status">Initializing instant-play engine... 0%</div>
  </div>

  <div id="save-bar" style="display:none">
    <div class="save-indicator" title="Automatic background persistence active">
      <span class="indicator-dot"></span>
      <span id="save-indicator-text">Auto-Resume Ready</span>
    </div>
    <button id="btn-export" title="Download PS1 memory card (.srm) for DuckStation/RetroArch">Export SRM</button>
    <button id="btn-export-state" title="Download instant live save state (.state)">Export State</button>
    <button id="btn-import" title="Load a memory card (.srm/.mcr) or live save state (.state)">Import</button>
    <button id="btn-restore" title="View & restore from automatic versioned backups">Backups</button>
    <button id="btn-restart" title="Start fresh game (current session will be backed up)">New Game</button>
  </div>
  <div id="save-toast"></div>
  <input type="file" id="save-file" accept=".srm,.mcr,.mcd,.sav,.bin,.state" style="display:none" />

  <div id="game"></div>

  <script>
    /*
     * Load the shared boot script from whichever layout the static host uses:
     * public/ as the deployment root, or the repository root as the site root.
     */
    (function loadDw1BootScript() {
      var statusEl = document.getElementById('loader-status');
      var sources = [
        './emulator-boot.js?v=2.2.9',
        '/emulator-boot.js?v=2.2.9',
        './public/emulator-boot.js?v=2.2.9',
        '/public/emulator-boot.js?v=2.2.9'
      ];
      var seen = Object.create(null);
      var index = 0;

      function fail() {
        if (statusEl) {
          statusEl.style.color = '#ef4444';
          statusEl.textContent = 'Error: could not load the emulator boot script.';
        }
      }

      function remove(script) {
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      function next() {
        if (index >= sources.length) return fail();
        var url;
        try {
          url = new URL(sources[index++], location.href).href;
        } catch (err) {
          return next();
        }
        if (seen[url]) return next();
        seen[url] = true;

        var script = document.createElement('script');
        script.src = url;
        script.onload = function () {
          if (!window.DW1_BOOT_STARTED) {
            remove(script);
            next();
          }
        };
        script.onerror = function () {
          remove(script);
          next();
        };
        document.head.appendChild(script);
      }

      next();
    })();
  </script>
</body>
</html>
