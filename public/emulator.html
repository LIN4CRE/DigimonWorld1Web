  <script>
    function showToast(msg, color = '#34d399') {
      const el = document.getElementById('statusToast');
      el.textContent = msg;
      el.style.color = color;
      el.style.display = 'inline-block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { el.style.display = 'none'; }, 4500);
    }

    document.getElementById('hdPresetSelect').onchange = (e) => {
      document.getElementById('game-container').className = e.target.value;
    };

    // Locate the 2MB PS1 RAM base offset inside the EmulatorJS WebAssembly HEAPU8
    // by matching the exact instruction signature of SLES_029.14 @ 0x800AA93C (offset 0x000AA93C in PS1 RAM):
    // EC 93 82 87 (lh $v0, -27668($gp)) | FF FF 01 24 (addiu $at, $zero, -1) | 0B 00 41 10 (beq $v0, $at, +11)
    let cachedPs1RamBase = -1;
    function findPs1RamBase() {
      const mod = window.EJS_emulator && window.EJS_emulator.gameManager && window.EJS_emulator.gameManager.Module;
      if (!mod || !mod.HEAPU8) return -1;
      const heap = mod.HEAPU8;
      const sig = [0xEC, 0x93, 0x82, 0x87, 0xFF, 0xFF, 0x01, 0x24, 0x0B, 0x00, 0x41, 0x10, 0x00, 0x00, 0x00, 0x00];

      // Check cached base first
      if (cachedPs1RamBase >= 0 && cachedPs1RamBase + 0x200000 <= heap.length) {
        let ok = true;
        for (let k = 0; k < sig.length; k++) {
          if (heap[cachedPs1RamBase + 0xAA93C + k] !== sig[k]) { ok = false; break; }
        }
        if (ok) return cachedPs1RamBase;
      }

      const limit = heap.length - 0x150000;
      for (let i = 0xAA93C; i < limit; i += 4) {
        if (
          heap[i] === 0xEC && heap[i + 1] === 0x93 && heap[i + 2] === 0x82 && heap[i + 3] === 0x87 &&
          heap[i + 4] === 0xFF && heap[i + 5] === 0xFF && heap[i + 6] === 0x01 && heap[i + 7] === 0x24 &&
          heap[i + 8] === 0x0B && heap[i + 9] === 0x00 && heap[i + 10] === 0x41 && heap[i + 11] === 0x10
        ) {
          cachedPs1RamBase = i - 0xAA93C;
          return cachedPs1RamBase;
        }
      }
      return -1;
    }

    function writeU16(heap, base, ps1Offset, val) {
      heap[base + ps1Offset] = val & 0xFF;
      heap[base + ps1Offset + 1] = (val >>> 8) & 0xFF;
    }

    // Trigger Live 3D In-Game Digivolution into any Digimon #1..#127
    document.getElementById('btnDigivolveNow').onclick = () => {
      const targetId = parseInt(document.getElementById('partnerSelect').value, 10);
      const selText = document.getElementById('partnerSelect').selectedOptions[0].text;
      const base = findPs1RamBase();
      const gm = window.EJS_emulator && window.EJS_emulator.gameManager;

      if (base >= 0) {
        const heap = gm.Module.HEAPU8;
        // Write Target Digimon ID to 0x8013BFE0 (-27668($gp)) and Item Evo Flag = 1 to 0x8013BFE2 (-27666($gp))
        writeU16(heap, base, 0x13BFE0, targetId);
        heap[base + 0x13BFE2] = 1;
        // Clear Virus/Poop gauge so it doesn't override with Sukamon
        writeU16(heap, base, 0x13FA46, 0);
        showToast(`✨ Digivolving into ${selText}! (Stand on any field map)`, '#fbbf24');
      } else if (gm && typeof gm.toggleCheat === 'function') {
        const hexId = targetId.toString(16).toUpperCase().padStart(4, '0');
        const code = `8013BFE0 ${hexId}\n3013BFE2 0001`;
        gm.toggleCheat('live_evo', code);
        setTimeout(() => {
          gm.toggleCheat('live_evo', code);
        }, 6500);
        showToast(`✨ Triggered Evolution Cheat -> ${selText}!`, '#fbbf24');
      } else {
        showToast(`⏳ Wait for PS1 BIOS & Title Screen to finish loading first!`, '#f87171');
      }
    };

    // Max 999 Stats, 9999 HP/MP & All 121 Battle Techniques
    document.getElementById('btnMaxStats').onclick = () => {
      const base = findPs1RamBase();
      const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
      if (base >= 0) {
        const heap = gm.Module.HEAPU8;
        writeU16(heap, base, 0x16C830, 999);  // Offense
        writeU16(heap, base, 0x16C832, 999);  // Defense
        writeU16(heap, base, 0x16C834, 999);  // Speed
        writeU16(heap, base, 0x16C836, 999);  // Brains
        writeU16(heap, base, 0x16C840, 9999); // Max HP
        writeU16(heap, base, 0x16C842, 9999); // Max MP
        writeU16(heap, base, 0x16C844, 9999); // Current HP
        writeU16(heap, base, 0x16C846, 9999); // Current MP
        writeU16(heap, base, 0x13FA46, 0);    // Clear Virus Gauge
        // Unlock all 121 techniques in bitmask (0x8016C850..0x8016C85F)
        for (let b = 0; b < 16; b++) {
          heap[base + 0x16C850 + b] = 0xFF;
        }
        showToast(`⚡ Partner boosted to 999 Stats, 9999 HP/MP & All 121 Moves!`, '#34d399');
      } else {
        showToast(`⏳ Wait for the game to boot past the Title Screen first!`, '#f87171');
      }
    };

    // Auto-boot Patched Digimon World (Europe).bin in 2x Neon HD
    EJS_player = '#game';
    EJS_core = 'psx';
    EJS_gameName = 'Digimon World (Europe) [SLES-02914] HD Unlocked';
    EJS_color = '#f59e0b';
    EJS_startOnLoaded = true;
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_gameUrl = '/rom/Digimon%20World%20(Europe).bin';

    EJS_defaultOptions = {
      'pcsx_rearmed_neon_enhancement_enable': 'enabled',
      'pcsx_rearmed_neon_enhancement_no_main': 'disabled',
      'pcsx_rearmed_dithering': 'disabled',
      'pcsx_rearmed_duping_enable': 'enabled',
      'pcsx_rearmed_show_bios_bootlogo': 'disabled'
    };
  </script>
