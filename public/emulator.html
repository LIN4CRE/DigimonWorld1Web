<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digimon World (Europe)</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #game {
      width: 100vw;
      height: 100vh;
    }
    #loader-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
    }
    #loader-title {
      font-size: 18px;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: 0.4px;
    }
    #progress-wrap {
      width: min(380px, 80vw);
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: #f59e0b;
      transition: width 0.15s ease;
    }
    #loader-status {
      font-size: 13px;
      color: #94a3b8;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="loader-overlay">
    <div id="loader-title">Digimon World (Europe)</div>
    <div id="progress-wrap">
      <div id="progress-bar"></div>
    </div>
    <div id="loader-status">Loading game disc... 0%</div>
  </div>

  <div id="game"></div>

  <script>
    /*
     * Load the shared boot script from whichever layout the static host uses:
     * public/ as the deployment root, or the repository root as the site root.
     */
    (function loadDw1BootScript() {
      var statusEl = document.getElementById('loader-status');
      var sources = [
        './emulator-boot.js',
        '/emulator-boot.js',
        './public/emulator-boot.js',
        '/public/emulator-boot.js'
      ];
      var seen = Object.create(null);
      var index = 0;

      function fail() {
        if (statusEl) {
          statusEl.style.color = '#ef4444';
          statusEl.textContent = 'Error: could not load the emulator boot script.';
        }
      }

      function remove(script) {
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      function next() {
        if (index >= sources.length) return fail();
        var url;
        try {
          url = new URL(sources[index++], location.href).href;
        } catch (err) {
          return next();
        }
        if (seen[url]) return next();
        seen[url] = true;

        var script = document.createElement('script');
        script.src = url;
        script.onload = function () {
          if (!window.DW1_BOOT_STARTED) {
            remove(script);
            next();
          }
        };
        script.onerror = function () {
          remove(script);
          next();
        };
        document.head.appendChild(script);
      }

      next();
    })();
  </script>
</body>
</html>
