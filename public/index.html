<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digimon World (Europe)</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/LIN4CRE/DigimonWorld1Web/main/public/favicon.svg" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #game {
      width: 100vw;
      height: 100vh;
    }
    #loader-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
    }
    #loader-title {
      font-size: 18px;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: 0.4px;
    }
    #progress-wrap {
      width: min(380px, 80vw);
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: #f59e0b;
      transition: width 0.15s ease;
    }
    #loader-status {
      font-size: 13px;
      color: #94a3b8;
      font-family: monospace;
    }
    #save-bar { position: fixed; top: 8px; right: 8px; z-index: 50; display: flex; gap: 6px; opacity: 0.35; transition: opacity .2s; font: 12px system-ui, sans-serif; }
    #save-bar:hover { opacity: 1; }
    #save-bar button { background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
    #save-bar button:hover { background: #f59e0b; color: #000; }
    #save-toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #f8fafc; border: 1px solid #f59e0b; border-radius: 8px; padding: 8px 14px; font: 13px system-ui; z-index: 60; display: none; }
  </style>
</head>
<body>
  <div id="loader-overlay">
    <div id="loader-title">Digimon World (Europe)</div>
    <div id="progress-wrap">
      <div id="progress-bar"></div>
    </div>
    <div id="loader-status">Loading game disc from GitHub... 0%</div>
  </div>

  <div id="save-bar" style="display:none">
    <button id="btn-export" title="Download your memory card save (.srm)">Export save</button>
    <button id="btn-import" title="Load a memory card save (.srm / .mcr)">Import save</button>
    <button id="btn-restore" title="Restore the latest automatic backup">Restore backup</button>
  </div>
  <div id="save-toast"></div>
  <input type="file" id="save-file" accept=".srm,.mcr,.mcd,.sav,.bin" style="display:none" />

  <div id="game"></div>

  <script>
    /*
     * Load the shared boot script from whichever layout the static host uses:
     * public/ as the deployment root, or the repository root as the site root.
     */
    (function loadDw1BootScript() {
      var statusEl = document.getElementById('loader-status');
      var sources = [
        './emulator-boot.js',
        '/emulator-boot.js',
        './public/emulator-boot.js',
        '/public/emulator-boot.js'
      ];
      var seen = Object.create(null);
      var index = 0;

      function fail() {
        if (statusEl) {
          statusEl.style.color = '#ef4444';
          statusEl.textContent = 'Error: could not load the emulator boot script.';
        }
      }

      function remove(script) {
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      function next() {
        if (index >= sources.length) return fail();
        var url;
        try {
          url = new URL(sources[index++], location.href).href;
        } catch (err) {
          return next();
        }
        if (seen[url]) return next();
        seen[url] = true;

        var script = document.createElement('script');
        script.src = url;
        script.onload = function () {
          if (!window.DW1_BOOT_STARTED) {
            remove(script);
            next();
          }
        };
        script.onerror = function () {
          remove(script);
          next();
        };
        document.head.appendChild(script);
      }

      next();
    })();
  </script>
</body>
</html>
